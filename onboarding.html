<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Complete Your Profile — Student Opportunity Engine</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .ob-bg { position:fixed;inset:0;background:radial-gradient(ellipse 70% 50% at 50% -10%,rgba(99,102,241,0.2) 0%,transparent 60%);pointer-events:none; }
  </style>
</head>
<body>
<div class="ob-bg"></div>

<div class="onboarding-page">
  <!-- Top branding -->
  <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-6);">
    <div class="sidebar-logo-icon" style="width:38px;height:38px;font-size:18px;">🎯</div>
    <div>
      <div style="font-weight:700;font-size:var(--text-base);">OpportunityEngine</div>
      <div style="font-size:var(--text-xs);color:var(--text-muted);">Build your opportunity profile</div>
    </div>
  </div>

  <div class="onboarding-card animate-scale-in">
    <!-- Progress bar -->
    <div class="onboarding-progress">
      <div class="onboarding-progress-fill" id="ob-progress" style="width:20%;"></div>
    </div>

    <div class="onboarding-header">
      <div class="onboarding-step-indicator" id="ob-step-indicator">Step 1 of 5</div>
      <h1 class="onboarding-step-title" id="ob-step-title">Basic Information</h1>
      <p class="onboarding-step-sub" id="ob-step-sub">Tell us about yourself so we can personalize your experience.</p>
    </div>

    <div class="onboarding-body" id="ob-body"></div>

    <div class="onboarding-footer">
      <button class="btn btn-secondary" id="ob-prev" style="visibility:hidden;">← Back</button>
      <div style="display:flex;align-items:center;gap:var(--space-3);">
        <div id="ob-dots" style="display:flex;gap:6px;"></div>
        <button class="btn btn-primary" id="ob-next">Next →</button>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="js/data/opportunities.js"></script>
<script src="js/data/mockUsers.js"></script>
<script src="js/services/recommendationEngine.js"></script>
<script src="js/services/userService.js"></script>
<script src="js/services/authService.js"></script>
<script src="js/services/savedService.js"></script>
<script src="js/services/trackerService.js"></script>
<script src="js/services/notificationService.js"></script>
<script src="js/components/toast.js"></script>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('soe_theme') || 'dark');

  // Auth guard
  const user = AuthService.getCurrentUser();
  if (!user) { window.location.href = 'auth.html'; }

  let profile = UserService.getOrCreateProfile(user.id, user.name, user.email);

  // ─── Step Definitions ─────────────────────────────────────────────────────
  const STEPS = [
    {
      id: 'basic',
      title: 'Basic Information',
      sub: 'Tell us about yourself — this helps match education-level requirements.',
      render: renderBasic,
      save: saveBasic,
    },
    {
      id: 'skills',
      title: 'Your Skills',
      sub: 'Select your current technical and soft skills. Be honest — this drives your match scores.',
      render: renderSkills,
      save: saveSkills,
    },
    {
      id: 'interests',
      title: 'Your Interests',
      sub: 'What areas excite you? This helps match opportunity domains to your passions.',
      render: renderInterests,
      save: saveInterests,
    },
    {
      id: 'career',
      title: 'Career Goals',
      sub: 'Where do you want to be? Career goal is one of the top factors in our recommendation engine.',
      render: renderCareer,
      save: saveCareer,
    },
    {
      id: 'prefs',
      title: 'Preferences',
      sub: 'Tell us what kind of opportunities you\'re looking for.',
      render: renderPrefs,
      save: savePrefs,
    },
  ];

  const SKILLS_LIST = [
    'Python','Java','JavaScript','C++','C#','Go','Rust','TypeScript',
    'React','Node.js','Vue.js','Angular','Next.js','Flutter','Kotlin','Android',
    'Machine Learning','Deep Learning','TensorFlow','PyTorch','NLP','Computer Vision',
    'Data Analysis','SQL','MongoDB','PostgreSQL','Firebase',
    'Cybersecurity','Linux','Networking','Kali Linux','Cryptography',
    'Cloud','AWS','Azure','GCP','Docker','Kubernetes','DevOps','Terraform',
    'Blockchain','Solidity','Ethereum','Web3.js',
    'UI/UX','Figma','Sketch','User Research',
    'Communication','Leadership','Problem Solving','Research Writing',
    'Statistics','Mathematics','Algorithms','Data Structures',
    'Embedded Systems','Arduino','Raspberry Pi','IoT',
    'Git','Open Source Contribution','Competitive Programming',
  ];

  const INTERESTS_LIST = [
    'Artificial Intelligence','Machine Learning','Data Science','Web Development',
    'App Development','Cybersecurity','Blockchain','Cloud Computing','DevOps',
    'Open Source','Competitive Programming','Research','Hackathons',
    'Entrepreneurship','Startups','Design','UI/UX','Finance','Quant Finance',
    'AR/VR','IoT','Embedded Systems','Social Impact','Space & Technology',
    'Quantum Computing','Game Development',
  ];

  const CAREER_GOALS_LIST = [
    'Software Engineer','Full Stack Developer','Backend Engineer','Frontend Engineer',
    'AI Engineer','Machine Learning Engineer','Data Scientist','Data Analyst',
    'Cybersecurity Engineer','Penetration Tester','Security Researcher',
    'Cloud Engineer','DevOps Engineer','Platform Engineer',
    'Product Manager','Product Designer','UI/UX Designer','Creative Director',
    'Researcher','PhD Student','Professor/Academic',
    'Entrepreneur','Startup Founder','Quant Analyst',
    'Blockchain Developer','Game Developer','AR/VR Engineer',
  ];

  let currentStep = 0;

  function renderDots() {
    const container = document.getElementById('ob-dots');
    container.innerHTML = STEPS.map((_, i) => `
      <div style="width:8px;height:8px;border-radius:50%;background:${i === currentStep ? 'var(--primary-500)' : 'rgba(255,255,255,0.15)'};transition:background 0.3s;"></div>
    `).join('');
  }

  function updateHeader() {
    const step = STEPS[currentStep];
    const pct = ((currentStep + 1) / STEPS.length * 100).toFixed(0);
    document.getElementById('ob-progress').style.width = pct + '%';
    document.getElementById('ob-step-indicator').textContent = `Step ${currentStep + 1} of ${STEPS.length}`;
    document.getElementById('ob-step-title').textContent = step.title;
    document.getElementById('ob-step-sub').textContent = step.sub;
    document.getElementById('ob-prev').style.visibility = currentStep === 0 ? 'hidden' : 'visible';
    document.getElementById('ob-next').textContent = currentStep === STEPS.length - 1 ? '🎉 Finish' : 'Next →';
  }

  function renderStep() {
    document.getElementById('ob-body').innerHTML = '';
    STEPS[currentStep].render();
    updateHeader();
    renderDots();
  }

  // ─── Step 1: Basic Info ───────────────────────────────────────────────────
  function renderBasic() {
    const b = profile.basic || {};
    document.getElementById('ob-body').innerHTML = `
      <div class="grid-2">
        <div class="form-group">
          <label class="form-label" for="ob-college">College / University *</label>
          <input class="form-input" id="ob-college" type="text" placeholder="IIT Delhi, BITS Pilani..." value="${b.college||''}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="ob-degree">Degree *</label>
          <select class="form-select" id="ob-degree">
            <option value="">Select degree</option>
            ${['B.Tech','B.E.','B.Sc','B.Des','B.Com','M.Tech','M.Sc','MBA','MCA','PhD'].map(d => `<option value="${d}" ${b.degree===d?'selected':''}>${d}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="ob-branch">Branch / Major *</label>
          <input class="form-input" id="ob-branch" type="text" placeholder="Computer Science, AI, ECE..." value="${b.branch||''}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="ob-year">Current Year *</label>
          <select class="form-select" id="ob-year">
            <option value="">Select year</option>
            ${[1,2,3,4,5,6].map(y => `<option value="${y}" ${b.year==y?'selected':''}>Year ${y}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="ob-location">Your Location</label>
          <input class="form-input" id="ob-location" type="text" placeholder="Delhi, India" value="${b.location||''}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="ob-cgpa">CGPA (optional)</label>
          <input class="form-input" id="ob-cgpa" type="number" min="0" max="10" step="0.01" placeholder="8.5" value="${b.cgpa||''}" />
        </div>
      </div>
    `;
  }

  function saveBasic() {
    const college = document.getElementById('ob-college').value.trim();
    const degree  = document.getElementById('ob-degree').value;
    const branch  = document.getElementById('ob-branch').value.trim();
    const year    = parseInt(document.getElementById('ob-year').value);
    if (!college || !degree || !branch || !year) {
      Toast.show({ type: 'warning', message: 'Please fill in all required fields.' });
      return false;
    }
    profile = UserService.updateProfile(user.id, {
      basic: {
        college, degree, branch, year,
        location: document.getElementById('ob-location').value.trim(),
        cgpa: parseFloat(document.getElementById('ob-cgpa').value) || null,
      }
    });
    return true;
  }

  // ─── Step 2: Skills ───────────────────────────────────────────────────────
  function renderSkills() {
    const selected = profile.skills || [];
    document.getElementById('ob-body').innerHTML = `
      <div style="margin-bottom:var(--space-3);font-size:var(--text-sm);color:var(--text-muted);">
        <strong style="color:var(--text-primary);">${selected.length}</strong> selected — click to toggle. Add custom skills below.
      </div>
      <div class="chips-grid" id="skills-chips">
        ${SKILLS_LIST.map(s => `
          <button class="chip ${selected.includes(s)?'selected':''}" data-skill="${s}">${s}</button>
        `).join('')}
      </div>
      <div style="margin-top:var(--space-4);display:flex;gap:var(--space-2);">
        <input class="form-input" id="custom-skill" type="text" placeholder="Add custom skill..." style="max-width:240px;" />
        <button class="btn btn-secondary" id="add-custom-skill">Add</button>
      </div>
      <div id="custom-skills-chips" class="chips-grid" style="margin-top:var(--space-2);"></div>
    `;

    document.querySelectorAll('#skills-chips .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        btn.classList.toggle('selected');
        updateSkillCount();
      });
    });

    document.getElementById('add-custom-skill').addEventListener('click', addCustomSkill);
    document.getElementById('custom-skill').addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();addCustomSkill();} });

    renderCustomSkillChips();
  }

  let customSkills = (profile.skills || []).filter(s => !SKILLS_LIST.includes(s));

  function addCustomSkill() {
    const input = document.getElementById('custom-skill');
    const val = input.value.trim();
    if (!val || customSkills.includes(val)) { input.value=''; return; }
    customSkills.push(val);
    input.value = '';
    renderCustomSkillChips();
  }

  function renderCustomSkillChips() {
    const c = document.getElementById('custom-skills-chips');
    if (!c) return;
    c.innerHTML = customSkills.map(s => `
      <span class="chip selected" style="cursor:default;">
        ${s} <span style="cursor:pointer;margin-left:4px;opacity:0.7;" data-remove="${s}">✕</span>
      </span>
    `).join('');
    c.querySelectorAll('[data-remove]').forEach(el => {
      el.addEventListener('click', () => {
        customSkills = customSkills.filter(s => s !== el.dataset.remove);
        renderCustomSkillChips();
      });
    });
  }

  function updateSkillCount() {
    const count = document.querySelectorAll('#skills-chips .chip.selected').length + customSkills.length;
    const info = document.querySelector('#ob-body > div:first-child');
    if (info) info.innerHTML = `<strong style="color:var(--text-primary);">${count}</strong> selected — click to toggle. Add custom skills below.`;
  }

  function saveSkills() {
    const fromChips = [...document.querySelectorAll('#skills-chips .chip.selected')].map(b => b.dataset.skill);
    const allSkills = [...new Set([...fromChips, ...customSkills])];
    if (allSkills.length < 1) {
      Toast.show({ type: 'warning', message: 'Please select at least 1 skill.' });
      return false;
    }
    profile = UserService.updateProfile(user.id, { skills: allSkills });
    return true;
  }

  // ─── Step 3: Interests ────────────────────────────────────────────────────
  function renderInterests() {
    const selected = profile.interests || [];
    document.getElementById('ob-body').innerHTML = `
      <div style="margin-bottom:var(--space-3);font-size:var(--text-sm);color:var(--text-muted);">
        <strong style="color:var(--text-primary);">${selected.length}</strong> selected — pick at least 2.
      </div>
      <div class="chips-grid" id="interests-chips">
        ${INTERESTS_LIST.map(s => `
          <button class="chip ${selected.includes(s)?'selected':''}" data-interest="${s}">${s}</button>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('#interests-chips .chip').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('selected'));
    });
  }

  function saveInterests() {
    const interests = [...document.querySelectorAll('#interests-chips .chip.selected')].map(b => b.dataset.interest);
    if (interests.length < 2) {
      Toast.show({ type: 'warning', message: 'Please select at least 2 interests.' });
      return false;
    }
    profile = UserService.updateProfile(user.id, { interests });
    return true;
  }

  // ─── Step 4: Career Goals ─────────────────────────────────────────────────
  function renderCareer() {
    const selected = profile.careerGoals || [];
    document.getElementById('ob-body').innerHTML = `
      <div style="background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.15);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-4);font-size:var(--text-sm);color:var(--primary-300);">
        🎯 <strong>This is the most important field.</strong> Your primary career goal drives 20% of your recommendation score.
      </div>
      <div style="margin-bottom:var(--space-3);font-size:var(--text-sm);color:var(--text-muted);">Select up to 3 career goals.</div>
      <div class="chips-grid" id="career-chips">
        ${CAREER_GOALS_LIST.map(s => `
          <button class="chip ${selected.includes(s)?'selected':''}" data-goal="${s}">${s}</button>
        `).join('')}
      </div>
    `;
    document.querySelectorAll('#career-chips .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        const selected = document.querySelectorAll('#career-chips .chip.selected');
        if (!btn.classList.contains('selected') && selected.length >= 3) {
          Toast.show({ type: 'info', message: 'You can select up to 3 career goals.' });
          return;
        }
        btn.classList.toggle('selected');
      });
    });
  }

  function saveCareer() {
    const goals = [...document.querySelectorAll('#career-chips .chip.selected')].map(b => b.dataset.goal);
    if (goals.length < 1) {
      Toast.show({ type: 'warning', message: 'Please select at least 1 career goal.' });
      return false;
    }
    profile = UserService.updateProfile(user.id, { careerGoals: goals });
    return true;
  }

  // ─── Step 5: Preferences ─────────────────────────────────────────────────
  function renderPrefs() {
    const p = profile.preferences || {};
    const TYPES = ['Internship','Hackathon','Scholarship','Competition','Research','Project','Workshop','Course','Freelance'];
    const selTypes = p.opportunityTypes || [];
    document.getElementById('ob-body').innerHTML = `
      <div class="form-group">
        <label class="form-label">Opportunity Types</label>
        <div class="chips-grid" id="pref-type-chips">
          ${TYPES.map(t => `<button class="chip ${selTypes.includes(t)?'selected':''}" data-type="${t}">${t}</button>`).join('')}
        </div>
      </div>
      <div class="grid-2" style="margin-top:var(--space-4);">
        <div class="form-group">
          <label class="form-label" for="pref-mode">Work Mode</label>
          <select class="form-select" id="pref-mode">
            <option value="">Any</option>
            ${['Remote','On-site','Hybrid'].map(m => `<option value="${m}" ${p.mode===m?'selected':''}>${m}</option>`).join('')}
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="pref-paid">Compensation</label>
          <select class="form-select" id="pref-paid">
            <option value="false" ${!p.paid?'selected':''}>Paid or Unpaid</option>
            <option value="true" ${p.paid?'selected':''}>Paid Only</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="pref-location">Preferred Location</label>
          <input class="form-input" id="pref-location" type="text" placeholder="Bangalore, Remote, Pan India..." value="${p.locationPreference||''}" />
        </div>
        <div class="form-group">
          <label class="form-label" for="pref-duration">Preferred Duration</label>
          <select class="form-select" id="pref-duration">
            <option value="">Any duration</option>
            ${['1 month','1-3 months','3-6 months','6+ months','1 year'].map(d => `<option value="${d}" ${p.durationPreference===d?'selected':''}>${d}</option>`).join('')}
          </select>
        </div>
      </div>
    `;
    document.querySelectorAll('#pref-type-chips .chip').forEach(btn => {
      btn.addEventListener('click', () => btn.classList.toggle('selected'));
    });
  }

  function savePrefs() {
    const types = [...document.querySelectorAll('#pref-type-chips .chip.selected')].map(b => b.dataset.type);
    profile = UserService.updateProfile(user.id, {
      preferences: {
        opportunityTypes: types,
        mode: document.getElementById('pref-mode').value,
        paid: document.getElementById('pref-paid').value === 'true',
        locationPreference: document.getElementById('pref-location').value.trim(),
        durationPreference: document.getElementById('pref-duration').value,
        domains: [],
        deadlinePreference: 'flexible',
      }
    });
    return true;
  }

  // ─── Navigation ───────────────────────────────────────────────────────────
  document.getElementById('ob-next').addEventListener('click', async () => {
    const saved = STEPS[currentStep].save();
    if (!saved) return;

    if (currentStep === STEPS.length - 1) {
      // Done — complete onboarding
      profile = UserService.getProfile(user.id);
      const score = RecommendationEngine.getProfileCompletionScore(profile);
      AuthService.markOnboardingComplete(user.email);

      // Show completion screen
      document.querySelector('.onboarding-card').innerHTML = `
        <div style="padding:var(--space-10);text-align:center;">
          <div style="font-size:60px;margin-bottom:var(--space-4);">🎉</div>
          <h2 style="font-size:var(--text-2xl);font-weight:var(--fw-extrabold);margin-bottom:var(--space-2);">Your Opportunity Profile is Ready!</h2>
          <p style="color:var(--text-secondary);margin-bottom:var(--space-6);">Profile completion: <strong style="color:var(--primary-300);">${score}%</strong><br>The recommendation engine is now calibrated to your unique profile.</p>
          <div class="progress-bar" style="max-width:300px;margin:0 auto var(--space-6);height:10px;">
            <div class="progress-fill" style="width:${score}%;"></div>
          </div>
          <div style="font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-8);">
            Skills: ${profile.skills.length} added &nbsp;·&nbsp;
            Interests: ${profile.interests.length} &nbsp;·&nbsp;
            Goals: ${profile.careerGoals.length}
          </div>
          <a href="dashboard.html" class="btn btn-primary btn-lg">🚀 View My Recommendations →</a>
        </div>
      `;
    } else {
      currentStep++;
      renderStep();
    }
  });

  document.getElementById('ob-prev').addEventListener('click', () => {
    if (currentStep > 0) { currentStep--; renderStep(); }
  });

  // Init
  renderStep();
</script>
</body>
</html>
