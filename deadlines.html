<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deadlines & Calendar — Student Opportunity Engine</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .timeline { position:relative;margin-top:var(--space-6);padding-left:var(--space-8); }
    .timeline::before { content:'';position:absolute;top:0;bottom:0;left:15px;width:2px;background:var(--border-color); }
    .timeline-item { position:relative;margin-bottom:var(--space-6); }
    .timeline-dot { position:absolute;left:calc(var(--space-8) * -1 + 10px);top:0;width:12px;height:12px;border-radius:50%;background:var(--border-color);border:2px solid var(--bg-main); }
    .timeline-item.urgent .timeline-dot { background:var(--danger-500);box-shadow:0 0 0 4px rgba(239,68,68,0.2); }
    .timeline-item.soon .timeline-dot { background:var(--warning-500);box-shadow:0 0 0 4px rgba(245,158,11,0.2); }
    .timeline-item.ok .timeline-dot { background:var(--primary-500); }
    
    .timeline-date { font-size:var(--text-sm);font-weight:var(--fw-bold);margin-bottom:var(--space-2);display:flex;align-items:center;gap:var(--space-2); }
    .timeline-card { background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--space-4);transition:transform 0.2s, box-shadow 0.2s;cursor:pointer; }
    .timeline-card:hover { transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--border-color); }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content">
    <div class="page-content">
      <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;">
        <div>
          <h1 class="page-title">⏰ Upcoming Deadlines</h1>
          <p class="page-subtitle">Track deadlines for your saved, interested, and recommended opportunities</p>
        </div>
        <select class="form-select" id="deadline-filter">
          <option value="30">Next 30 days</option>
          <option value="90">Next 3 months</option>
          <option value="all">All upcoming</option>
        </select>
      </div>
      
      <div class="timeline" id="timeline"></div>
    </div>
  </div>
</div>

<script src="js/data/opportunities.js"></script>
<script src="js/data/mockUsers.js"></script>
<script src="js/services/recommendationEngine.js"></script>
<script src="js/services/userService.js"></script>
<script src="js/services/authService.js"></script>
<script src="js/services/opportunityService.js"></script>
<script src="js/services/savedService.js"></script>
<script src="js/services/trackerService.js"></script>
<script src="js/services/notificationService.js"></script>
<script src="js/services/aiAssistant.js"></script>
<script src="js/components/toast.js"></script>
<script src="js/components/sidebar.js"></script>
<script src="js/components/aiChat.js"></script>
<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('soe_theme') || 'dark');
  if (!AuthService.requireAuth()) throw new Error();
  const user = AuthService.getCurrentUser();
  const profile = UserService.getProfile(user.id);
  Sidebar.init({ page: 'deadlines', currentUser: user, studentProfile: profile });

  function render() {
    const filter = document.getElementById('deadline-filter').value;
    const days = filter === 'all' ? 9999 : parseInt(filter);
    const deadlines = OpportunityService.getUpcomingDeadlines(days, profile);
    const container = document.getElementById('timeline');
    
    if (deadlines.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">🎉</div><h3>No upcoming deadlines</h3><p>You're all caught up!</p></div>`;
      return;
    }

    container.innerHTML = deadlines.map(opp => {
      const today = new Date();
      const diff = Math.ceil((new Date(opp.deadline) - today) / (1000*60*60*24));
      const urgencyClass = diff <= 3 ? 'urgent' : diff <= 7 ? 'soon' : 'ok';
      const urgencyLabel = diff === 0 ? 'Today!' : diff === 1 ? 'Tomorrow' : `In ${diff} days`;
      const dateStr = new Date(opp.deadline).toLocaleDateString('en-IN', { weekday:'short', month:'short', day:'numeric' });
      
      // Determine context: is it saved? applied? recommended?
      let contextBadge = '';
      if (TrackerService.getApplicationStatus(user.id, opp.id)) {
        contextBadge = `<span class="badge badge-accent">Tracked</span>`;
      } else if (SavedService.isSaved(user.id, opp.id)) {
        contextBadge = `<span class="badge badge-warning">Saved</span>`;
      } else if (opp.recommendation) {
        contextBadge = `<span class="badge badge-success">${opp.recommendation.score}% Match</span>`;
      }

      return `
        <div class="timeline-item ${urgencyClass} animate-fade-in">
          <div class="timeline-dot"></div>
          <div class="timeline-date">
            <span style="color:var(--text-primary);">${dateStr}</span>
            <span class="deadline-badge ${urgencyClass}" style="font-size:10px;">${urgencyLabel}</span>
            ${contextBadge}
          </div>
          <div class="timeline-card" onclick="window.location.href='opportunity.html?id=${opp.id}'">
            <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);">
              <div>
                <div style="font-weight:var(--fw-bold);font-size:var(--text-base);margin-bottom:2px;">${opp.title}</div>
                <div style="font-size:var(--text-sm);color:var(--text-muted);">🏢 ${opp.organization}</div>
              </div>
              <span class="badge badge-${opp.category.toLowerCase()}">${opp.category}</span>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('deadline-filter').addEventListener('change', render);
  render();
  AIChat.init(profile);
</script>
</body>
</html>
