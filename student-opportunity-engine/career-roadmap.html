<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Roadmap - Student Opportunity Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .roadmap-container {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 0;
        }

        .roadmap-container::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 24px;
            width: 2px;
            background-color: var(--border-color);
            z-index: 1;
        }

        .roadmap-stage {
            position: relative;
            margin-bottom: 3rem;
            padding-left: 4rem;
            z-index: 2;
        }

        .stage-icon {
            position: absolute;
            left: 8px;
            top: 0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .roadmap-stage.completed .stage-icon {
            background-color: var(--success);
            border-color: var(--success);
            color: white;
        }

        .roadmap-stage.current .stage-icon {
            background-color: var(--accent);
            border-color: var(--accent);
            color: white;
            box-shadow: 0 0 0 4px var(--accent-light);
        }

        .stage-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-md);
            padding: 1.5rem;
            transition: var(--transition);
        }

        .roadmap-stage.current .stage-card {
            border-color: var(--accent);
            box-shadow: 0 4px 12px var(--accent-light);
        }

        .stage-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .stage-status {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            padding: 0.2rem 0.5rem;
            border-radius: var(--border-radius-sm);
        }

        .status-completed { background-color: var(--success-light); color: var(--success); }
        .status-current { background-color: var(--accent-light); color: var(--accent); }
        .status-upcoming { background-color: var(--primary-bg); color: var(--text-secondary); }

        .stage-desc {
            color: var(--text-secondary);
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        .stage-section {
            margin-bottom: 1rem;
        }

        .stage-section-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .action-item {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            background-color: var(--primary-bg);
            padding: 0.75rem;
            border-radius: var(--border-radius-sm);
            border: 1px solid transparent;
        }

        .action-item.recommended {
            border-color: rgba(0, 86, 210, 0.3);
            background-color: rgba(0, 86, 210, 0.05);
        }
        
        .action-item svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        @media (max-width: 768px) {
            .roadmap-container::before {
                left: 20px;
            }
            .stage-icon {
                left: 4px;
            }
            .roadmap-stage {
                padding-left: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="sidebar-container"></div>
        
        <div class="main-content">
            <div id="header-container"></div>
            
            <div class="page-content">
                <div class="page-header" style="text-align: center; max-width: 600px; margin: 0 auto 3rem auto;">
                    <h1 class="page-title">Your Career Roadmap</h1>
                    <p class="page-description">A personalized step-by-step path generated from your profile, skill gaps, and career goals.</p>
                </div>

                <div id="roadmap-container">
                    <!-- Skeletons / API Content / Error -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/career-roadmap.js"></script>
</body>
</html>
