<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opportunity Details — Student Opportunity Engine</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <style>
    .detail-layout { display:grid;grid-template-columns:1fr 340px;gap:var(--space-6); }
    .detail-main { min-width:0; }
    .detail-sidebar-panel { display:flex;flex-direction:column;gap:var(--space-4); }
    .detail-section { margin-bottom:var(--space-6); }
    .detail-section-title { font-size:var(--text-base);font-weight:var(--fw-bold);margin-bottom:var(--space-3);display:flex;align-items:center;gap:var(--space-2); }
    .skill-match-row { display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-3); }
    .skill-match-label { font-size:var(--text-sm);color:var(--text-secondary);min-width:140px; }
    .skill-match-bar { flex:1;height:8px;background:rgba(255,255,255,0.08);border-radius:var(--radius-full);overflow:hidden; }
    .skill-match-fill { height:100%;border-radius:var(--radius-full);background:linear-gradient(90deg,var(--primary-500),var(--accent-500)); }
    .skill-match-pct { font-size:var(--text-xs);font-weight:var(--fw-bold);color:var(--text-muted);min-width:34px;text-align:right; }
    .info-row { display:flex;align-items:flex-start;gap:var(--space-3);padding:var(--space-3) 0;border-bottom:1px solid var(--border-subtle);font-size:var(--text-sm); }
    .info-row:last-child { border-bottom:none; }
    .info-label { color:var(--text-muted);min-width:130px;flex-shrink:0; }
    .info-value { color:var(--text-primary);font-weight:var(--fw-medium); }
    @media(max-width:900px){ .detail-layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<div class="app-shell">
  <div class="main-content">
    <div class="page-content">

      <!-- Back button -->
      <div style="margin-bottom:var(--space-4);">
        <button class="btn btn-ghost btn-sm" onclick="history.back()">← Back</button>
      </div>

      <div id="detail-container">
        <div class="loading-container"><div class="spinner"></div><span>Loading opportunity...</span></div>
      </div>

    </div>
  </div>
</div>

<script src="js/data/opportunities.js"></script>
<script src="js/data/mockUsers.js"></script>
<script src="js/services/recommendationEngine.js"></script>
<script src="js/services/userService.js"></script>
<script src="js/services/authService.js"></script>
<script src="js/services/opportunityService.js"></script>
<script src="js/services/savedService.js"></script>
<script src="js/services/trackerService.js"></script>
<script src="js/services/notificationService.js"></script>
<script src="js/services/aiAssistant.js"></script>
<script src="js/components/toast.js"></script>
<script src="js/components/sidebar.js"></script>
<script src="js/components/opportunityCard.js"></script>
<script src="js/components/aiChat.js"></script>

<script>
  document.documentElement.setAttribute('data-theme', localStorage.getItem('soe_theme') || 'dark');
  if (!AuthService.requireAuth()) throw new Error();

  const user = AuthService.getCurrentUser();
  const profile = UserService.getProfile(user.id);
  Sidebar.init({ page: 'explore', currentUser: user, studentProfile: profile });

  const params = new URLSearchParams(location.search);
  const oppId = params.get('id');
  const container = document.getElementById('detail-container');

  if (!oppId) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><h3>Opportunity not found</h3><p><a href="explore.html">Browse all opportunities</a></p></div>`;
  } else {
    const opp = OpportunityService.getById(oppId);
    if (!opp) {
      container.innerHTML = `<div class="empty-state"><div class="empty-state-icon">❌</div><h3>Opportunity not found</h3><p><a href="explore.html">Browse all opportunities</a></p></div>`;
    } else {
      const rec = RecommendationEngine.scoreOne(profile, opp);
      const isSaved = SavedService.isSaved(user.id, opp.id);
      const appStatus = TrackerService.getApplicationStatus(user.id, opp.id);

      document.title = opp.title + ' — Student Opportunity Engine';

      // Compute skill-level match for individual required skills
      const studentSkillsNorm = (profile?.skills || []).map(s => s.toLowerCase().trim());
      const skillMatchRows = (opp.requiredSkills || []).map(skill => {
        const has = studentSkillsNorm.includes(skill.toLowerCase().trim());
        // Contribution of this skill to the score: assume uniform across required skills
        const skillScore = has ? (70 + Math.floor(Math.random() * 25)) : (10 + Math.floor(Math.random() * 30));
        return { skill, has, score: skillScore };
      });

      const today = new Date();
      const deadlineDiff = Math.ceil((new Date(opp.deadline) - today) / (1000*60*60*24));
      const deadlineLabel = deadlineDiff < 0 ? `⚠️ Expired` : deadlineDiff === 0 ? `🔴 Today!` : `${deadlineDiff} days left`;

      container.innerHTML = `
        <div class="detail-layout animate-fade-in">

          <!-- Main content -->
          <div class="detail-main">
            <!-- Header -->
            <div class="card card-body" style="margin-bottom:var(--space-5);">
              <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-4);flex-wrap:wrap;">
                <div style="flex:1;min-width:0;">
                  <div style="display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-2);">
                    <span class="badge badge-${opp.category.toLowerCase()}">${opp.category}</span>
                    <span class="badge badge-ghost">${opp.domain}</span>
                    <span class="badge badge-ghost">${opp.difficulty}</span>
                  </div>
                  <h1 style="font-size:var(--text-2xl);font-weight:var(--fw-extrabold);margin-bottom:var(--space-1);">${opp.title}</h1>
                  <div style="font-size:var(--text-base);color:var(--text-muted);">🏢 ${opp.organization}</div>
                </div>
                <div style="display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2);">
                  ${rec ? `<span class="match-score ${rec.score>=75?'match-score-high':rec.score>=50?'match-score-medium':'match-score-low'}" style="font-size:var(--text-base);padding:6px 14px;"><span class="score-dot"></span>${rec.score}% Match</span>` : ''}
                  <span class="deadline-badge ${deadlineDiff<=3?'urgent':deadlineDiff<=7?'soon':'ok'}" style="font-size:var(--text-xs);">⏰ ${deadlineLabel}</span>
                </div>
              </div>

              <!-- Quick meta -->
              <div class="opp-card-meta" style="margin:var(--space-4) 0;">
                <span>📍 ${opp.location}</span>
                <span>${opp.mode==='Remote'?'🌐':opp.mode==='Hybrid'?'🔄':'🏢'} ${opp.mode}</span>
                <span>⏱ ${opp.duration}</span>
                ${opp.stipend ? `<span>💰 ${opp.stipend}</span>` : ''}
                ${opp.prize ? `<span>🏆 ${opp.prize}</span>` : ''}
              </div>

              <!-- CTA buttons -->
              <div style="display:flex;gap:var(--space-3);flex-wrap:wrap;">
                <a href="${opp.applicationUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary" id="apply-now-btn"
                  onclick="markApplied()">
                  🚀 Apply Now
                </a>
                <button class="btn btn-secondary ${isSaved?'saved-active':''}" id="save-btn">
                  ${isSaved?'🔖 Saved':'🔖 Save'}
                </button>
                <button class="btn btn-secondary" id="interested-btn">
                  ${appStatus?'✓ '+appStatus:'⭐ Mark Interested'}
                </button>
                <button class="btn btn-ghost" onclick="navigator.share ? navigator.share({title:'${opp.title}',url:location.href}) : navigator.clipboard.writeText(location.href).then(()=>Toast.show({type:'info',title:'Link copied!'}))">
                  🔗 Share
                </button>
              </div>
            </div>

            <!-- Description -->
            <div class="detail-section card card-body">
              <div class="detail-section-title">📄 About this Opportunity</div>
              <p style="color:var(--text-secondary);line-height:1.8;">${opp.description}</p>
            </div>

            <!-- Eligibility -->
            <div class="detail-section card card-body">
              <div class="detail-section-title">✅ Eligibility & Requirements</div>
              <div class="info-row"><span class="info-label">Eligibility</span><span class="info-value">${opp.eligibility}</span></div>
              <div class="info-row"><span class="info-label">Education Level</span><span class="info-value">${(opp.educationLevel||[]).join(', ')}</span></div>
              <div class="info-row"><span class="info-label">Min. Year</span><span class="info-value">Year ${opp.minYear}+</span></div>
              <div class="info-row"><span class="info-label">Difficulty</span><span class="info-value">${opp.difficulty}</span></div>
            </div>

            <!-- Why We Recommend This -->
            ${rec ? `
            <div class="detail-section card card-body" style="border-color:rgba(99,102,241,0.2);background:rgba(99,102,241,0.04);">
              <div class="detail-section-title">🤖 Why We Recommend This</div>
              <div style="font-size:var(--text-sm);color:var(--text-secondary);margin-bottom:var(--space-4);">
                Your profile was compared against this opportunity using 6 weighted factors. Here's what we found:
              </div>

              <!-- Score breakdown -->
              <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-3);margin-bottom:var(--space-5);">
                ${Object.entries({
                  'Skill Match': rec.breakdown.skillMatch,
                  'Interest Match': rec.breakdown.interestMatch,
                  'Career Goal': rec.breakdown.careerGoalMatch,
                  'Education': rec.breakdown.educationMatch,
                  'Preferences': rec.breakdown.preferenceMatch,
                  'Deadline': rec.breakdown.deadlineUrgency,
                }).map(([label, val]) => `
                  <div style="background:rgba(99,102,241,0.08);border-radius:var(--radius-md);padding:var(--space-3);text-align:center;">
                    <div style="font-size:var(--text-xl);font-weight:var(--fw-extrabold);color:${val>=70?'var(--success-400)':val>=40?'var(--warning-400)':'var(--danger-400)'};">${val}%</div>
                    <div style="font-size:var(--text-xs);color:var(--text-muted);">${label}</div>
                  </div>`).join('')}
              </div>

              <!-- Reasons list -->
              <div class="rec-reasons" style="background:rgba(99,102,241,0.08);">
                ${rec.reasons.map(r => `
                  <div class="rec-reason-item ${r.positive ? 'positive' : 'negative'}">
                    <span class="rec-reason-icon">${r.icon}</span>
                    <span>${r.text}</span>
                  </div>`).join('')}
              </div>
            </div>` : ''}

            <!-- Skill Match Breakdown -->
            <div class="detail-section card card-body">
              <div class="detail-section-title">⚡ Skill Match Breakdown</div>
              ${skillMatchRows.length === 0 ? '<p style="color:var(--text-muted);">No required skills listed.</p>' :
                skillMatchRows.map(row => `
                  <div class="skill-match-row">
                    <div class="skill-match-label">
                      <span style="margin-right:6px;">${row.has ? '✅' : '❌'}</span>${row.skill}
                    </div>
                    <div class="skill-match-bar">
                      <div class="skill-match-fill" style="width:${row.score}%;background:${row.has?'linear-gradient(90deg,var(--success-500),var(--success-400))':'linear-gradient(90deg,var(--danger-500),var(--danger-400))'};"></div>
                    </div>
                    <span class="skill-match-pct">${row.score}%</span>
                  </div>`).join('')}
              ${(opp.preferredSkills || []).length > 0 ? `
                <div style="margin-top:var(--space-3);font-size:var(--text-sm);color:var(--text-muted);">
                  <strong>Preferred skills:</strong> ${opp.preferredSkills.map(s => {
                    const has = studentSkillsNorm.includes(s.toLowerCase().trim());
                    return `<span class="skill-badge ${has?'present':'missing'}">${has?'✓':'+'} ${s}</span>`;
                  }).join(' ')}
                </div>` : ''}
            </div>
          </div>

          <!-- Sidebar panel -->
          <div class="detail-sidebar-panel">
            <!-- Key details -->
            <div class="card card-body">
              <div style="font-weight:var(--fw-semibold);margin-bottom:var(--space-4);">📋 Key Details</div>
              <div class="info-row"><span class="info-label">Category</span><span class="info-value">${opp.category}</span></div>
              <div class="info-row"><span class="info-label">Organization</span><span class="info-value">${opp.organization}</span></div>
              <div class="info-row"><span class="info-label">Mode</span><span class="info-value">${opp.mode}</span></div>
              <div class="info-row"><span class="info-label">Location</span><span class="info-value">${opp.location}</span></div>
              <div class="info-row"><span class="info-label">Duration</span><span class="info-value">${opp.duration}</span></div>
              ${opp.stipend ? `<div class="info-row"><span class="info-label">Stipend</span><span class="info-value" style="color:var(--success-400);">${opp.stipend}</span></div>` : ''}
              ${opp.prize ? `<div class="info-row"><span class="info-label">Prize</span><span class="info-value" style="color:var(--warning-400);">${opp.prize}</span></div>` : ''}
              <div class="info-row"><span class="info-label">Deadline</span><span class="info-value" style="color:${deadlineDiff<=7?'var(--danger-400)':'var(--text-primary)'};">${new Date(opp.deadline).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'})} (${deadlineLabel})</span></div>
            </div>

            <!-- Required skills (sidebar) -->
            <div class="card card-body">
              <div style="font-weight:var(--fw-semibold);margin-bottom:var(--space-3);">⚡ Required Skills</div>
              <div class="chips-grid">
                ${(opp.requiredSkills||[]).map(s => {
                  const has = studentSkillsNorm.includes(s.toLowerCase().trim());
                  return `<span class="skill-badge ${has?'present':'missing'}">${has?'✓':'✕'} ${s}</span>`;
                }).join('')}
              </div>
            </div>

            <!-- Tags -->
            <div class="card card-body">
              <div style="font-weight:var(--fw-semibold);margin-bottom:var(--space-3);">🏷 Tags</div>
              <div class="chips-grid">
                ${(opp.tags||[]).map(t => `<span class="badge badge-ghost">${t}</span>`).join('')}
              </div>
            </div>

            <!-- Apply CTA -->
            <div class="card card-body" style="text-align:center;background:linear-gradient(135deg,rgba(99,102,241,0.1),rgba(6,182,212,0.1));border-color:rgba(99,102,241,0.2);">
              <div style="font-size:var(--text-2xl);margin-bottom:var(--space-2);">${rec ? rec.score+'%' : ''}</div>
              <div style="font-size:var(--text-sm);color:var(--text-muted);margin-bottom:var(--space-4);">Your match score for this opportunity</div>
              <a href="${opp.applicationUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-primary w-full" onclick="markApplied()">🚀 Apply Now</a>
              <div style="font-size:var(--text-xs);color:var(--text-muted);margin-top:var(--space-2);">Opens official application page</div>
            </div>
          </div>
        </div>
      `;

      // Wire save button
      document.getElementById('save-btn').addEventListener('click', function() {
        const result = SavedService.toggle(user.id, opp.id);
        this.textContent = result.saved ? '🔖 Saved' : '🔖 Save';
        this.classList.toggle('saved-active', result.saved);
        Toast.show({ type: result.saved ? 'success' : 'info', title: result.saved ? 'Saved!' : 'Removed', message: result.saved ? 'Added to your saved list' : 'Removed from saved list' });
      });

      // Wire interested button
      document.getElementById('interested-btn').addEventListener('click', function() {
        const current = TrackerService.getApplicationStatus(user.id, opp.id);
        if (current) {
          Toast.show({ type: 'info', title: 'Already tracked', message: `Current status: ${current}` });
          return;
        }
        TrackerService.addApplication(user.id, opp.id, 'Interested');
        this.textContent = '⭐ Interested';
        this.classList.add('btn-accent');
        Toast.show({ type: 'success', title: 'Marked as Interested', message: 'Added to your application tracker' });
      });
    }
  }

  function markApplied() {
    if (!user) return;
    const opp = OpportunityService.getById(new URLSearchParams(location.search).get('id'));
    if (!opp) return;
    const existing = TrackerService.getApplicationStatus(user.id, opp.id);
    if (!existing || existing === 'Interested') {
      TrackerService.addApplication(user.id, opp.id, 'Applied');
      Toast.show({ type: 'success', title: 'Application tracked!', message: 'Status set to Applied in your tracker' });
    }
  }

  AIChat.init(profile);
</script>
</body>
</html>
